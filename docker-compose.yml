services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: team_task_manager
      MARIADB_USER: app
      MARIADB_PASSWORD: app
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      JWT_SECRET: zmien-mnie-na-losowy-sekret
      JWT_EXPIRES_IN: 7d
      DATABASE_URL: mysql://app:app@db:3306/team_task_manager
      DATABASE_HOST: db
      DATABASE_PORT: 3306
      DATABASE_USER: app
      DATABASE_PASSWORD: app
      DATABASE_NAME: team_task_manager
    ports:
      - "3000:3000"
    command: sh -c "npx prisma migrate deploy && npx tsx src/server.ts"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  db_data:
